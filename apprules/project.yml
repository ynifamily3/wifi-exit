# Wi-Fi Exit 본 앱과 앱별 스플리팅 시스템 확장.
# 팀 ID 는 build.sh 가 키체인의 Developer ID 인증서에서 읽어 TEAM_ID 로 넘긴다 (저장소에 적지 않는다).
name: WifiExit
options:
  bundleIdPrefix: com.miel
  deploymentTarget:
    macOS: "15.2"
settings:
  base:
    DEVELOPMENT_TEAM: ${TEAM_ID}
    SWIFT_VERSION: "5"
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: NO
targets:
  WifiExit:
    type: application
    platform: macOS
    sources:
      - ../app.swift
      - ../rules_window.swift
      - ../routes_window.swift
      - ../outside.swift
      - ../exit_reasons.swift
      - ../ui_kit.swift
      - ../shared.swift
      - ../conditions.swift
      - ../app_policy.swift
      - ../app_identity.swift
      - ../app_rules.swift
      - path: ../icon/AppIcon.icns
        buildPhase: resources
    info:
      path: App/Info.plist
      properties:
        CFBundleName: Wi-Fi Exit
        CFBundleDisplayName: Wi-Fi Exit
        CFBundlePackageType: APPL
        CFBundleShortVersionString: ${APP_VERSION}
        CFBundleVersion: ${APP_BUILD}
        LSMinimumSystemVersion: "15.2"
        LSApplicationCategoryType: public.app-category.utilities
        NSSystemExtensionUsageDescription: 선택한 앱의 TCP·UDP 연결을 지정한 네트워크로 중계합니다.
        LSUIElement: true
        CFBundleIconFile: AppIcon
        CFBundleURLTypes:
          - CFBundleURLName: com.miel.WifiExit
            CFBundleURLSchemes: [wifi-exit]
    entitlements:
      path: App/App.entitlements
      properties:
        com.apple.developer.networking.networkextension: [app-proxy-provider-systemextension]
        com.apple.developer.system-extension.install: true
        com.apple.security.application-groups: ["${TEAM_ID}.com.miel.WifiExit.AppRules"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.miel.WifiExit
        PRODUCT_NAME: WifiExit
    dependencies:
      - target: AppRulesProxy
        embed: true
  AppRulesProxy:
    type: system-extension
    platform: macOS
    sources:
      - Proxy
      - ../shared.swift
      - ../conditions.swift
      - ../app_policy.swift
      - ../app_identity.swift
    info:
      path: Proxy/Info.plist
      properties:
        CFBundleDisplayName: Wi-Fi Exit 앱 규칙 확장
        CFBundlePackageType: SYSX
        CFBundleShortVersionString: ${APP_VERSION}
        CFBundleVersion: ${APP_BUILD}
        NSSystemExtensionUsageDescription: 앱 규칙에 고른 앱의 연결만 정한 출구(Wi-Fi 등)로 보내요. 다른 앱의 연결은 건드리지 않아요.
        NetworkExtension:
          NEMachServiceName: ${TEAM_ID}.com.miel.WifiExit.AppRules.proxy
          NEProviderClasses:
            com.apple.networkextension.app-proxy: $(PRODUCT_MODULE_NAME).AppRuleProvider
    entitlements:
      path: Proxy/Proxy.entitlements
      properties:
        com.apple.developer.networking.networkextension: [app-proxy-provider-systemextension]
        com.apple.security.application-groups: ["${TEAM_ID}.com.miel.WifiExit.AppRules"]
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        # 결과 전달 1안: 엔진이 쓰는 상태 폴더를 읽기 전용으로 (A0 에서 확인)
        com.apple.security.temporary-exception.files.absolute-path.read-only: ["/Library/Application Support/WifiExit/state/"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.miel.WifiExit.AppRules.proxy
        # macOS 는 시스템 확장을 "<번들 ID>.systemextension" 이름으로 찾는다
        PRODUCT_NAME: com.miel.WifiExit.AppRules.proxy
        PRODUCT_MODULE_NAME: AppRulesProxy
