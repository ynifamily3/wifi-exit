# Wi-Fi Exit 앱 규칙: 투명 프록시 시스템 확장과 그것을 담는 작은 앱.
# 팀 ID 는 build.sh 가 키체인의 Developer ID 인증서에서 읽어 TEAM_ID 로 넘긴다 (저장소에 적지 않는다).
name: WifiExitAppRules
options:
  bundleIdPrefix: com.miel
  deploymentTarget:
    macOS: "15.2"
settings:
  base:
    DEVELOPMENT_TEAM: ${TEAM_ID}
    SWIFT_VERSION: "5"
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
targets:
  WifiExitAppRules:
    type: application
    platform: macOS
    sources: [App]
    info:
      path: App/Info.plist
      properties:
        CFBundleName: Wi-Fi Exit 앱 규칙
        CFBundleDisplayName: Wi-Fi Exit 앱 규칙
        CFBundlePackageType: APPL
        CFBundleShortVersionString: ${APP_VERSION}
        CFBundleVersion: ${APP_BUILD}
        LSMinimumSystemVersion: "15.2"
        LSUIElement: true
    entitlements:
      path: App/App.entitlements
      properties:
        com.apple.developer.networking.networkextension: [app-proxy-provider-systemextension]
        com.apple.developer.system-extension.install: true
        com.apple.security.application-groups: ["${TEAM_ID}.com.miel.WifiExit.AppRules"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.miel.WifiExit.AppRules
        PRODUCT_NAME: WifiExitAppRules
    dependencies:
      - target: AppRulesProxy
        embed: true
  AppRulesProxy:
    type: system-extension
    platform: macOS
    sources: [Proxy]
    info:
      path: Proxy/Info.plist
      properties:
        CFBundleDisplayName: Wi-Fi Exit 앱 규칙 확장
        CFBundlePackageType: SYSX
        CFBundleShortVersionString: ${APP_VERSION}
        CFBundleVersion: ${APP_BUILD}
        NSSystemExtensionUsageDescription: 앱 규칙에 고른 앱의 연결만 정한 출구(Wi-Fi 등)로 보내요. 다른 앱의 연결은 건드리지 않아요.
        NetworkExtension:
          NEMachServiceName: ${TEAM_ID}.com.miel.WifiExit.AppRules.proxy
          NEProviderClasses:
            com.apple.networkextension.app-proxy: $(PRODUCT_MODULE_NAME).AppRuleProvider
    entitlements:
      path: Proxy/Proxy.entitlements
      properties:
        com.apple.developer.networking.networkextension: [app-proxy-provider-systemextension]
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.application-groups: ["${TEAM_ID}.com.miel.WifiExit.AppRules"]
        # 결과 전달 1안: 엔진이 쓰는 상태 폴더를 읽기 전용으로 (A0 에서 확인)
        com.apple.security.temporary-exception.files.absolute-path.read-only: ["/Library/Application Support/WifiExit/state/"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.miel.WifiExit.AppRules.proxy
        # macOS 는 시스템 확장을 "<번들 ID>.systemextension" 이름으로 찾는다
        PRODUCT_NAME: com.miel.WifiExit.AppRules.proxy
        PRODUCT_MODULE_NAME: AppRulesProxy
